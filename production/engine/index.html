<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bebas Neue"; src: url("node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2") format("woff2"); }
html,body { margin:0; background:#000; }
canvas { display:block; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head><body>
<script type="module">
import { Engine } from './src/engine.js';
const q = new URLSearchParams(location.search);
const { board } = await import(`./boards/${q.get('board')}.js`);
await document.fonts.load('150px "Bebas Neue"');
const eng = new Engine(board);
window.FP = { render: (t) => eng.render(t), board: { duration: board.duration, fps: board.fps, shots: board.shots.map(s => ({ id: s.id, angle: s.angle, start: s.start, end: s.end, top: s.top, step: s.step })), captions: board.captions, script: board.script }, stage: eng.stage };
window.FP_READY = true;
</script>
</body></html>
